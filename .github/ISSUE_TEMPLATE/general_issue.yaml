name: General issue
description: File a general issue that doesn't fit into other categories
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue! Please make sure to fill out the entire form below, providing as much context as you can in order to help us triage your issue.

        Before filing an issue, please be sure you have searched through [existing issues](https://github.com/open-telemetry/opentelemetry-erlang/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc) to see if an existing issue covers your concern.
  - type: textarea
    attributes:
      label: Issue description
      description: A clear and concise description of what the issue is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0